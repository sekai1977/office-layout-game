<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オフィスを作れ！</title><link rel="stylesheet" href="style.css"><body><header><div><small>OFFICE LAYOUT CHALLENGE</small><h1>オフィスを作れ！</h1></div><span>考える。置く。働きやすくする。</span></header><main><aside><div id="stages"></div><h2 id="title"></h2><p id="brief"></p><div class="label">レンタル家具を選ぶ</div><div id="catalog"></div><p class="hint">家具を選んで床を押すと配置。置いた家具を押して選択 → 別の床を押すと移動できます。</p><div class="actions"><button id="rotate">↻ 家具を回転</button><button id="remove">選択家具を戻す</button><button id="undo">ひとつ戻す</button></div><button id="judge" class="primary">レイアウトを採点する →</button></aside><section class="workspace"><div class="viewbar"><span id="status">家具を選んで、床に置こう</span><button id="camera">視点を回す ↻</button></div><div id="scene"></div><div class="legend">青い床＝入口 ・ 白い床＝通路にも使えます ・ 1マス＝約80cm</div></section></main><dialog id="result"><button id="close" class="close">閉じる ×</button><small>LAYOUT REVIEW</small><h2 id="verdict"></h2><div id="score"></div><div id="breakdown"></div><ul id="feedback"></ul><div id="success"><p>ええかんじじゃね、ぜひうちの面接きてや</p><a href="https://www.office-pits.co.jp/" target="_blank" rel="noopener">オフィスコーポレーションのHPを見る ↗</a><button id="next" class="primary">次のステージへ →</button></div><p class="hint">採点はこのゲーム独自の基準です。実際の設計審査・採用判定ではありません。</p></dialog><script type="module" src="app.js"></script></body></html>
